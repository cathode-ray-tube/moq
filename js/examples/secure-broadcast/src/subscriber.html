<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoQ subscriber</title>
    <style>
      body {
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
        font-family: sans-serif;
      }

      label {
        display: block;
        margin: 0.75rem 0;
      }

      input {
        margin-left: 0.5rem;
      }

      canvas {
        display: block;
        width: 100%;
        max-width: 960px;
        aspect-ratio: 16 / 9;
        background: black;
      }

      #status {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>MoQ subscriber</h1>

    <label>
      Relay URL
      <input id="url" value="https://cdn.moqtv.com:4443/anon" size="45" />
    </label>

    <label>
      Broadcast name
      <input id="name" value="me.hang" />
    </label>

    <button id="subscribe">Watch broadcast</button>

    <canvas id="video"></canvas>
    <pre id="status">Not watching</pre>

    <script type="module" src="/src/subscriber.ts"></script>
  </body>
</html>
