<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoQ Subscriber Logger</title>
    <style>
      body {
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
        font: 16px/1.5 system-ui, sans-serif;
      }

      label {
        display: block;
        margin: 1rem 0;
      }

      input {
        box-sizing: border-box;
        display: block;
        width: 100%;
        margin-top: 0.25rem;
        padding: 0.5rem;
      }

      button {
        padding: 0.6rem 1rem;
      }

      #status {
        margin-top: 1rem;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>MoQ Subscriber Logger</h1>

    <label>
      Relay URL
      <input
        id="url"
        type="url"
        value="https://cdn.moqtv.com:4443/anon"
        autocomplete="url"
      />
    </label>

    <label>
      Broadcast name
      <input id="name" type="text" value="me.hang" />
    </label>

    <label>
      Track name
      <input id="track" type="text" value="catalog.json" />
    </label>

    <button id="subscribe" type="button">Subscribe and log</button>
    <p id="status" role="status" aria-live="polite">Not connected.</p>

    <script type="module" src="./subscriber-log-frames.ts"></script>
  </body>
</html>
